<style>

<script src="config.js"></script>
<script>
const API=window.API_URL,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let tok;try{tok=localStorage.tok}catch{}
const vid=(()=>{try{return localStorage.vid||(localStorage.vid=crypto.randomUUID())}catch{return'anon'}})();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U=u=>esc(/^(https?:|mailto:|tel:)/i.test(u||'')?u:'#'),I=u=>esc(/^(https?:|data:image\/(jpeg|png|webp);base64,)/i.test(u||'')?u:'');
const G=l=>{l=String(l).toLowerCase();return/whats/.test(l)?'W':/mail/.test(l)?'@':/linked/.test(l)?'in':/git/.test(l)?'GH':/^x$|twitter/.test(l)?'X':/face/.test(l)?'f':/insta/.test(l)?'IG':/you/.test(l)?'▶':'↗'};
async function api(p,o={}){const h={};if(o.body&&!(o.body instanceof FormData))h['Content-Type']='application/json';if(tok)h.Authorization='Bearer '+tok;
 const r=await fetch(API+p,{...o,headers:h});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
const R={like:'👍',love:'❤️',insightful:'💡'};let PJ={},C=null;
function draw(p,pr,po){
 const S=document.documentElement.style,hide=p.hide||[];
 /^#[0-9a-f]{6}$/i.test(p.accent||'')?S.setProperty('--ac',p.accent):S.removeProperty('--ac');p.font==='sans'?S.setProperty('--hf','var(--bf)'):S.removeProperty('--hf');
 ['about','exp','edu','projects','feed','contact'].forEach(id=>$('#'+id).style.display=!tok&&hide.includes(id)?'none':'');
 const soc=(p.links||[]).map(l=>`<a class="soc" href="${U(l.url)}" target="_blank" rel="noopener"><i>${G(l.label)}</i>${esc(l.label)}</a>`).join('');
 document.title=(p.name||'Portfolio')+' | Portfolio';$('#nm').textContent=p.name||'Portfolio';$('#yr').textContent='© '+new Date().getFullYear()+' '+(p.name||'');
 $('#hero').innerHTML=`<div class="hero">${p.avatar?`<img class="av" src="${I(p.avatar)}" alt="">`:''}<div><div class="eyebrow">${esc(p.location||'')}</div><h1>${esc(p.name||'Your Name')}</h1><p class="lead">${esc(p.headline||'Your headline')}</p>${p.availability?`<span class="pill">● ${esc(p.availability)}</span>`:''}<div class="cta">${p.resume?`<a class="btn" href="${U(p.resume)}" target="_blank" rel="noopener">Download CV</a>`:''}<a class="btn ghost" href="#contact">Contact me</a></div><div class="socs">${soc}</div></div></div>`;
 $('#stats').innerHTML=(p.stats||[]).map(s=>`<div class="stat"><b>${esc(s.value)}</b>${esc(s.label)}</div>`).join('');
 $('#about').innerHTML=`<h2>About</h2><p class="pre">${esc(p.about||'Tell visitors who you are using the edit panel.')}</p>${(p.skills||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}`;
 const tl=(h,a,f)=>`<h2>${h}</h2><div class="tl">${a.map(f).join('')||'<p class="mut">Nothing here yet.</p>'}</div>`;
 $('#exp').innerHTML=tl('Experience',p.experience||[],e=>`<div class="it"><h3>${esc(e.role)}</h3><div class="mut">${esc(e.company)} · ${esc(e.years)}</div><p>${esc(e.impact)}</p></div>`);
 $('#edu').innerHTML=tl('Education',p.education||[],e=>`<div class="it"><h3>${esc(e.degree)}</h3><div class="mut">${esc(e.school)} · ${esc(e.years)}</div></div>`);
 PJ={};$('#pl').innerHTML=pr.map(({id,data:d})=>{PJ[id]=d;return`<article class="card pj">${d.image?`<img class="pimg" loading="lazy" src="${I(d.image)}" alt="">`:''}<div class="pb"><h3>${esc(d.title)}</h3><p>${esc(d.summary)}</p>${d.outcome?`<p><b>Impact:</b> ${esc(d.outcome)}</p>`:''}${(d.stack||'').split(',').filter(x=>x.trim()).map(s=>`<span class="chip">${esc(s.trim())}</span>`).join('')}<div class="cta">${d.demo?`<a class="btn" href="${U(d.demo)}" target="_blank" rel="noopener">Live demo</a>`:''}${d.repo?`<a class="btn ghost" href="${U(d.repo)}" target="_blank" rel="noopener">Code</a>`:''}<button class="ghost admi" data-ep="${id}">Edit</button><button class="ghost admi" data-dp="${id}">Delete</button></div></div></article>`}).join('')||'<p class="mut">Projects coming soon.</p>';
 $('#fl').innerHTML=po.map(x=>`<div class="card post"><small>${new Date(x.created).toLocaleDateString()}</small> <button class="ghost admi" data-dpost="${x.id}">Delete</button><p>${esc(x.body)}</p>${x.media_url?(x.media_type==='video'?`<video controls preload="metadata" src="${I(x.media_url)}"></video>`:`<img loading="lazy" src="${I(x.media_url)}" alt="">`):''}
 <div class="rx">${Object.entries(R).map(([k,e])=>`<button class="ghost" data-react="${x.id}:${k}">${e} ${x.reactions[k]||0}</button>`).join('')}</div>
 ${x.comments.map(c=>`<div class="cm"><b>${esc(c.name)}</b> <button class="ghost admi" data-dc="${c.id}">×</button><br>${esc(c.body)}</div>`).join('')}
 <form class="cf" data-id="${x.id}"><input name="name" placeholder="Your name" maxlength="60" required><input name="body" placeholder="Write a comment…" maxlength="1000" required><button>Comment</button></form></div>`).join('')||'<p class="mut">No updates yet.</p>';
 $('#contact').innerHTML=`<h2>Let's connect</h2><p class="lead">Open to opportunities, collaborations and good conversations.</p><div class="socs">${soc||'<span class="mut">Add your links in the edit panel.</span>'}</div>`;
}
const lines=v=>v.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(r=>r[0]);
function fill(p){const f=$('#pf').elements;['name','headline','location','availability','resume','about','avatar'].forEach(k=>f[k].value=p[k]||'');
 f.skills.value=(p.skills||[]).join(', ');f.stats.value=(p.stats||[]).map(s=>s.value+' | '+s.label).join('\n');
 f.experience.value=(p.experience||[]).map(e=>[e.role,e.company,e.years,e.impact].join(' | ')).join('\n');f.education.value=(p.education||[]).map(e=>[e.degree,e.school,e.years].join(' | ')).join('\n');
 f.links.value=(p.links||[]).map(l=>l.label+' | '+l.url).join('\n');f.accent.value=/^#[0-9a-f]{6}$/i.test(p.accent||'')?p.accent:'#c0362c';f.font.value=p.font||'serif';
 $$('#pf [name=hide]').forEach(c=>c.checked=(p.hide||[]).includes(c.value))}
const CK='pf_cache';
async function load(){const r=await Promise.allSettled([api('/api/profile'),api('/api/projects'),api('/api/posts')]);const bad=r.find(x=>x.status==='rejected');
 if(r.every(x=>x.status==='rejected'))throw bad.reason;
 const v=r.map((x,i)=>x.status==='fulfilled'?x.value:(C?C[i]:[{},[],[]][i]));draw(...v);if(tok&&r[0].status==='fulfilled')fill(v[0]);
 if(bad)throw bad.reason;C=v;try{localStorage[CK]=JSON.stringify(v)}catch{}}
const run=f=>async e=>{e.preventDefault();try{await f(e)}catch(x){alert(x.message);if(x.message==='Not authorised'){try{delete localStorage.tok}catch{}location.reload()}}};
const shrink=(file,max,sq)=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height,sx=0,sy=0,sw=w,sh=h;
 if(sq){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;w=h=Math.min(max,m)}else{const k=Math.min(1,max/w);w=Math.round(w*k);h=Math.round(h*k)}
 const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,w,h);let q=.8,d;do{d=c.toDataURL('image/jpeg',q);q-=.1}while(d.length>140000&&q>.3);ok(d)};im.onerror=()=>no(new Error('Could not read that image'));im.src=URL.createObjectURL(file)});
$('#avf').onchange=run(async e=>{if(e.target.files[0])$('#pf [name=avatar]').value=await shrink(e.target.files[0],320,true)});
$('#pjf').onchange=run(async e=>{if(e.target.files[0])$('#jf [name=image]').value=await shrink(e.target.files[0],800)});
$('#pf').onsubmit=run(async e=>{const fd=new FormData(e.target),f=Object.fromEntries(fd);
 await api('/api/profile',{method:'PUT',body:JSON.stringify({name:f.name,headline:f.headline,location:f.location,availability:f.availability,resume:f.resume,about:f.about,avatar:f.avatar,accent:f.accent,font:f.font,hide:fd.getAll('hide'),
 skills:f.skills.split(',').map(s=>s.trim()).filter(Boolean),stats:lines(f.stats).map(([value,label])=>({value,label})),experience:lines(f.experience).map(([role,company,years,impact])=>({role,company,years,impact})),
 education:lines(f.education).map(([degree,school,years])=>({degree,school,years})),links:lines(f.links).map(([label,url])=>({label,url}))})});await load()});
$('#jf').onsubmit=run(async e=>{const f=e.target,old=f.dataset.edit;await api('/api/projects',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});
 if(old)await api('/api/projects/'+old,{method:'DELETE'});f.reset();delete f.dataset.edit;$('#jb').textContent='Add project';await load()});
$('#nf').onsubmit=run(async e=>{const b=e.target.querySelector('button');b.disabled=true;try{await api('/api/posts',{method:'POST',body:new FormData(e.target)});e.target.reset();await load()}finally{b.disabled=false}});
document.addEventListener('submit',run(async e=>{if(!e.target.classList.contains('cf'))return;await api(`/api/posts/${e.target.dataset.id}/comments`,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await load()}),true);
document.addEventListener('click',run(async e=>{const d=(e.target.closest('button')||{}).dataset||{};
 if(d.react){const[id,kind]=d.react.split(':');await api(`/api/posts/${id}/react`,{method:'POST',body:JSON.stringify({visitor:vid,kind})});await load()}
 else if(d.ep){const x=PJ[d.ep],f=$('#jf');['title','summary','outcome','stack','demo','repo','image'].forEach(k=>f.elements[k].value=x[k]||'');f.dataset.edit=d.ep;$('#jb').textContent='Save changes';f.closest('details').open=true;f.scrollIntoView({block:'center'})}
 else if(d.dp&&confirm('Delete project?')){await api('/api/projects/'+d.dp,{method:'DELETE'});await load()}
 else if(d.dpost&&confirm('Delete post?')){await api('/api/posts/'+d.dpost,{method:'DELETE'});await load()}
 else if(d.dc){await api('/api/comments/'+d.dc,{method:'DELETE'});await load()}}));
$('#th').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.theme=t}catch{}};
$('#adl').textContent=tok?'Log out':'Admin';document.body.classList.toggle('admin',!!tok);
$('#adl').onclick=run(async e=>{e.preventDefault();if(tok){try{delete localStorage.tok}catch{}location.reload();return}
 const pw=prompt('Admin password');if(!pw)return;localStorage.tok=(await api('/api/login',{method:'POST',body:JSON.stringify({password:pw})})).token;location.reload()});
const io='IntersectionObserver'in window?new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting&&x.target.classList.add('in')),{threshold:.05}):null;$$('.rv').forEach(el=>io?io.observe(el):el.classList.add('in'));
async function boot(){let c=null;try{c=JSON.parse(localStorage[CK]||'null')}catch{}if(c){C=c;draw(...c);if(tok)fill(c[0])}
